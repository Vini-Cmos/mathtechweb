<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | MathTech</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">∑</span>
      <span class="brand-text">MathTech<small>Matemática &amp; Informática</small></span>
    </a>
    <nav class="site-nav" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="sobre.html">Projeto</a>
      <a href="sistemas.html">Sistemas</a>
      <a href="multimidia.html">Multimídia</a>
      <a href="interlab.html">Inter-Lab</a>
      <a class="active" href="cadastro.html">Cadastro</a>
    </nav>
  </div>
</header>
<section class="page-hero">
  <div class="container">
    <span class="kicker">Formulário HTML5</span>
    <h1>Cadastro</h1>
    <p>Preencha os campos abaixo para realizar seu cadastro no MathTech.</p>
  </div>
</section>
<main class="section">
  <div class="container">
    <div class="card form-card">
      <form action="#" method="post">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required autocomplete="name" placeholder="Digite seu nome completo">

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="date" required>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="nome@exemplo.com">

        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" required autocomplete="tel" placeholder="(00) 00000-0000">

        <label for="cidade">Cidade</label>
        <input id="cidade" name="cidade" type="text" required autocomplete="address-level2" placeholder="Digite sua cidade">

        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
          <option value="" selected disabled>Selecione seu estado</option>
          <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option>
          <option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option>
          <option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option>
          <option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option>
          <option>SP</option><option>SE</option><option>TO</option>
        </select>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" minlength="6" required autocomplete="new-password" placeholder="Crie uma senha">

        <label for="confirmar">Confirmar senha</label>
        <input id="confirmar" name="confirmar" type="password" minlength="6" required autocomplete="new-password" placeholder="Digite a senha novamente">

        <label><input type="checkbox" required> Li e concordo com os termos de uso.</label>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Cadastrar</button>
          <button class="btn btn-outline" type="reset">Limpar</button>
        </div>
      </form>
    </div>
  </div>
</main>
<footer class="site-footer">
  <div class="container footer-wrap">
    <strong>MathTech</strong>
    <span>Desenvolvido por Cosme Vinicius — 2026</span>
  </div>
</footer>
</body>
</html>
